# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/main/uds.schema.json
kind: UDSBundle
metadata:
  name: var-test
  description: UDS bundle for deploying the standard UDS Core package on an AWS EKS cluster.
  architecture: amd64
  version: "1.2.3"
packages:
  - name: zarf-init-s3-backend
    repository: ghcr.io/zarf-dev/packages/init
    ref: v0.74.0
    overrides:
      zarf-agent:
        zarf-agent:
          variables:
            - name: ZARF_AGENT_AFFINITY_CUSTOM
              path: affinity
              default: {}
  - name: core-base
    repository: ghcr.io/defenseunicorns/packages/uds/core-base
    ref: 1.0.0-upstream
    optionalComponents:
      - istio-passthrough-gateway
    overrides:
      istio-controlplane:
        istiod:
          variables:
            - name: ISTIO_REQUESTS_MEMORY
              path: global.proxy.resources.requests.memory
              default: 56Mi
            - name: UDS_CORE_NODE_SELECTOR
              path: nodeSelector
              default: {}
      istio-admin-gateway:
        gateway:
          variables:
            - name: ISTIOD_ADMIN_GW_SVC_ANNOTATIONS
              path: service.annotations
            - name: UDS_CORE_NODE_SELECTOR
              path: nodeSelector
              default: {}
        uds-istio-config:
          values:
            # Enable TLS 1.2 support
            - path: tls.supportTLSV1_2
              value: true
          variables:
            - name: ADMIN_TLS_CERT
              description: "The TLS cert for the admin gateway (must be base64 encoded)"
              path: tls.cert
            - name: ADMIN_TLS_KEY
              description: "The TLS key for the admin gateway (must be base64 encoded)"
              path: tls.key
      istio-tenant-gateway:
        gateway:
          variables:
            - name: ISTIOD_TENANT_GW_SVC_ANNOTATIONS
              path: service.annotations
            - name: UDS_CORE_NODE_SELECTOR
              path: nodeSelector
              default: {}
        uds-istio-config:
          values:
            # Enable TLS 1.2 support
            - path: tls.supportTLSV1_2
              value: true
          variables:
            - name: TENANT_TLS_CERT
              description: "The TLS cert for the tenant gateway (must be base64 encoded)"
              path: tls.cert
            - name: TENANT_TLS_KEY
              description: "The TLS key for the tenant gateway (must be base64 encoded)"
              path: tls.key
      istio-passthrough-gateway:
        gateway:
          variables:
            - name: ISTIOD_PASSTHRU_GW_SVC_ANNOTATIONS
              path: service.annotations
            - name: UDS_CORE_NODE_SELECTOR
              path: nodeSelector
              default: {}
      pepr-uds-core:
        module:
          variables:
            - name: UDS_CORE_NODE_SELECTOR
              path: watcher.nodeSelector
              default: {}
            - name: UDS_CORE_NODE_SELECTOR
              path: admission.nodeSelector
              default: {}